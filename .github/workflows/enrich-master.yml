name: Enrich fixed childcare facility master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 pdfplumber

      - name: Enrich fixed master from official PDF
        run: python scripts/enrich_facility_master.py

      - name: Commit enriched master and audit
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/facility_master.json data/facility_master_audit.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "data: enrich fixed childcare facility master"
          git pull --rebase origin main
          git push origin main
