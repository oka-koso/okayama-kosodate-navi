name: Apply private website audit batch 11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Batch 11 and audit remaining private facilities
        id: audit
        continue-on-error: true
        run: python scripts/apply_private_websites_batch11.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/private_website_audit_batch11.json ] && git add data/private_website_audit_batch11.json
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            git add data/facility_master.json
            git add data/private_website_remaining_after_batch11.json
          fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: verify private websites batch 11 and audit remainder"
          git pull --rebase origin main
          git push origin main

      - name: Fail if validation failed
        if: steps.audit.outcome != 'success'
        run: exit 1
