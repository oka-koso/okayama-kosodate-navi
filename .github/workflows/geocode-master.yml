name: Geocode fixed facility master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Geocode fixed master
        run: python scripts/geocode_fixed_master.py

      - name: Commit coordinates
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/facility_master.json

          if git diff --cached --quiet; then
            echo "No coordinate changes"
            exit 0
          fi

          git commit -m "data: geocode fixed facility master"
          git pull --rebase origin main
          git push origin main
