name: Install AdSense trust pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/install_adsense_trust_pages.py
      - name: Commit
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add operator and privacy pages"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
