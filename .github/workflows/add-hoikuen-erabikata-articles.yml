name: Add Hoikuen Erabikata Articles
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add article metadata and sitemap URLs
        run: python scripts/install_hoikuen_erabikata_articles.py
      - name: Validate JSON
        run: python -m json.tool data/bibouroku.json > /dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/hoikuen-erabikata-part1.html articles/hoikuen-erabikata-part2.html data/bibouroku.json sitemap.xml
          git diff --cached --quiet || git commit -m "Add nursery selection articles part 1 and 2"
          git push
