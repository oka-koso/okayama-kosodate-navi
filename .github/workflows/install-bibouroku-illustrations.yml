name: Install Bibouroku Illustrations
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install illustrations
        run: python scripts/install_bibouroku_illustrations.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bibouroku css/bibouroku.css js/bibouroku.js bibouroku.html articles/
          git diff --cached --quiet || git commit -m "Add illustrations to Kosodate Bibouroku"
          git push
