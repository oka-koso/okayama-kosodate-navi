name: Repair facility master and guard it

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair canonical 206-facility master
        run: python scripts/repair_facility_master.py
      - name: Disable scheduled PDF-to-master mutator
        run: python scripts/disable_availability_master_mutator.py
      - name: Commit repair
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/facility_master.json data/facility_master_repair_audit.json .github/workflows scripts
          if git diff --cached --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git commit -m "fix: restore canonical facility master and stop unsafe auto mutation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
