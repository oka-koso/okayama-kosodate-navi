name: Install Home Bibouroku Feature
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install home Bibouroku feature
        run: python scripts/install_home_bibouroku_feature.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/home-bibouroku-feature.css js/home-bibouroku-feature.js
          git diff --cached --quiet || git commit -m "Improve Bibouroku visibility on home page"
          git push
