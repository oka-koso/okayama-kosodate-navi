name: Install unified header and footer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared site shell
        run: python scripts/install_unified_site_shell.py
      - name: Safety check
        run: |
          test -f js/site-shell.js
          test -f css/site-shell.css
          for f in index.html hoikuen.html moushikomi.html score.html tochuu.html about.html operator.html privacy.html; do
            grep -q 'data-site-header' "$f"
            grep -q 'data-site-footer' "$f"
            grep -q 'js/site-shell.js' "$f"
          done
      - name: Commit
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: unify header and footer including footerless pages"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
