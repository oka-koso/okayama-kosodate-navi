name: Install admission score calculator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required calculator files
        run: |
          test -f score.html
          test -f css/score-calculator.css
          test -f js/score-calculator.js
          test -f data/admission-score-rules-R8.json
          python -m json.tool data/admission-score-rules-R8.json >/dev/null

      - name: Add calculator links to existing pages
        run: python scripts/install_score_calculator.py

      - name: Commit
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add score.html css/score-calculator.css js/score-calculator.js \
                  data/admission-score-rules-R8.json scripts/install_score_calculator.py \
                  index.html hoikuen.html moushikomi.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add childcare admission score calculator"
          git pull --rebase origin main
          git push origin main
