name: Fix Batch 5 - Kyokusou

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Kyokusou to current official data
        id: fix
        continue-on-error: true
        run: python scripts/fix_batch5_kyokusou.py

      - name: Commit audit and safe changes
        if: always()
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -f data/private_website_audit_batch5_fix1.json ]; then
            git add data/private_website_audit_batch5_fix1.json
          fi
          if [ "${{ steps.fix.outcome }}" = "success" ]; then
            git add data/facility_master.json
          fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "fix: migrate Kyokusou Kodomoen to current official data"
          git pull --rebase origin main
          git push origin main

      - name: Fail if migration failed
        if: steps.fix.outcome != 'success'
        run: exit 1
