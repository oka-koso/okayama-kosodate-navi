name: Install Facility Master 206 Guard
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install guard
        run: python scripts/install_facility_master_guard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facility_master_206_canonical.json scripts/update_availability_dual.py
          git diff --cached --quiet || git commit -m "Guard availability update with verified 206 master"
          git push
