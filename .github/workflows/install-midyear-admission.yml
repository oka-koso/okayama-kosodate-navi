name: Install midyear admission page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install navigation links
        run: python scripts/install_midyear_admission.py
      - name: Generate current midyear admission data
        run: |
          pip install requests beautifulsoup4
          python scripts/update_midyear_admission.py
      - name: Commit installation
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hoikuen.html moushikomi.html score.html support.html contact.html 2>/dev/null || true
          git add tochuu.html css/midyear-admission.css js/midyear-admission.js scripts/update_midyear_admission.py scripts/update_availability_dual.py .github/workflows/update-availability-fixed.yml data/midyear_admission.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "feat: add auto-updating midyear admission guide"
          git pull --rebase origin main
          git push origin main
