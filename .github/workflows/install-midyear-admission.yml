name: Install midyear admission page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install navigation links
        run: python scripts/install_midyear_admission.py
      - name: Generate current midyear admission data
        run: |
          pip install requests beautifulsoup4
          python scripts/update_midyear_admission.py
      - name: Commit installation
        run: |
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          # The installer/data generator may touch files beyond the fixed list above.
          # Stage every generated change so the worktree is clean before rebase.
          git add -A
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git status --short
          git commit -m "feat: add auto-updating midyear admission guide"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
