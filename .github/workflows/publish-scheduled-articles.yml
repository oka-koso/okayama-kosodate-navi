name: Publish scheduled notebook articles
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-scheduled-articles.yml
      - scripts/publish_scheduled_articles.py
      - _scheduled_articles/**
  workflow_dispatch:
  schedule:
    # JST 00:05 and 00:35. A second check retries if a scheduled run is delayed.
    - cron: '5,35 15 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: scheduled-notebook-articles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release articles whose publication day has arrived in Japan
        run: python scripts/publish_scheduled_articles.py
      - name: Commit articles, listings and sitemap together
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard articles/)" ]; then
            echo "No scheduled articles due"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles/ data/bibouroku.json index.html bibouroku.html sitemap.xml moushikomi.html
          git commit -m "content: publish due notebook articles"
          git pull --rebase origin main
          git push origin main
          echo "released=true" >> "$GITHUB_OUTPUT"
      - name: Request a Pages build after the bot commit
        if: steps.commit.outputs.released == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --silent
