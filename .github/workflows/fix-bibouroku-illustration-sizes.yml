name: Fix Bibouroku Illustration Sizes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Make illustrations compact
        run: python scripts/fix_bibouroku_illustration_sizes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/bibouroku.css
          git diff --cached --quiet || git commit -m "Make Bibouroku illustrations compact"
          git push
