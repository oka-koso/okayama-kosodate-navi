name: Check Okayama City childcare availability

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"

  schedule:
    - cron: '20 8 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check official data and update when published
        run: python scripts/update_data.py

      - name: Geocode newly added facilities
        run: python scripts/geocode.py

      - name: Commit official data changes
        run: |
          if git diff --quiet; then echo "No official data changes"; exit 0; fi
          git config user.name "okayama-kosodate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/facilities.json
          git commit -m "data: update Okayama City childcare availability"
          git push
